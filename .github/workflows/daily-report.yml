# Posts the daily score table as a comment on one tracking issue.
#
# This lives on GitHub Actions rather than in a Claude Code cloud routine
# because that sandbox's egress proxy refuses finance.yahoo.com:
#   curl: (7) CONNECT tunnel failed, response 403
# Actions runners have open egress, so the same script works unchanged.
#
# Runs at 04:00 UTC on weekdays (07:00 Europe/Tallinn in summer, 06:00 in
# winter -- cron has no timezone, so the local hour shifts with DST). Each run
# reports the most recently completed session.
name: Daily score report

on:
  schedule:
    - cron: "0 4 * * 1-5"
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions:
  contents: read
  issues: write                # the only write it needs: to comment

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ISSUE_TITLE: "Daily score report"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Only what the report needs. requirements.txt also pulls the web app
      # (fastapi, uvicorn), which this job never starts.
      - name: Install
        run: pip install --quiet pandas numpy yfinance

      - name: Score the watchlist
        id: run
        run: |
          set +e
          python tools/daily_report.py > report.md 2> stderr.txt
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat report.md

      - name: Build the comment
        run: |
          {
            echo "### $(date -u '+%A %d %B %Y') &middot; run $GITHUB_RUN_NUMBER"
            echo
            cat report.md
            if [ "${{ steps.run.outputs.exit }}" != "0" ]; then
              echo
              echo "<details><summary>stderr (exit ${{ steps.run.outputs.exit }})</summary>"
              echo
              echo '```'
              tail -c 3000 stderr.txt
              echo '```'
              echo
              echo "</details>"
            fi
            echo
            base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main"
            echo "<sub>Generated by [\`tools/daily_report.py\`]($base/tools/daily_report.py)."
            echo "Tickers come from [\`watchlist.json\`]($base/watchlist.json) &mdash;"
            echo "edit that file to change what is scored. Not advice.</sub>"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      # One issue, reused forever. Creating it here rather than requiring a
      # manual step means the workflow is self-installing.
      - name: Find or create the tracking issue
        id: issue
        run: |
          num=$(gh issue list --state all --search "$ISSUE_TITLE in:title" \
                  --json number,title \
                  --jq "[.[] | select(.title == \"$ISSUE_TITLE\")] | first | .number // empty")
          if [ -z "$num" ]; then
            num=$(gh issue create --title "$ISSUE_TITLE" \
                    --body "Each weekday run of \`tools/daily_report.py\` posts its table here as a comment. Close this issue to stop collecting them; the workflow will open a new one." \
                    | grep -oE '[0-9]+$')
            echo "created issue #$num"
          fi
          echo "number=$num" >> "$GITHUB_OUTPUT"

      - name: Post the comment
        run: gh issue comment "${{ steps.issue.outputs.number }}" --body-file comment.md

      # Fail the run only when nothing at all could be scored, so a single dead
      # ticker does not turn the whole report red.
      - name: Surface a total failure
        if: steps.run.outputs.exit == '2'
        run: |
          echo "::error::Nothing could be scored - see the issue comment for the errors."
          exit 1
