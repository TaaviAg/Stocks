<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b6cb0">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<title>Stocks · Log in</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<main class="login">
  <div class="brand"><span class="mark"></span><h1>Stock Trading Tracker</h1></div>
  <form id="login-form" class="panel">
    <h2>Log in</h2>
    <p class="sub">This device is not the laptop the tracker runs on, so it needs
      the password. It stays signed in for 30 days.</p>
    <label class="field"><span>Password</span>
      <input type="password" id="password" autocomplete="current-password" required autofocus></label>
    <button type="submit" class="primary" id="go">Log in</button>
    <p class="err" id="msg" role="alert"></p>
  </form>
</main>
<script>
document.getElementById("login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), msg = document.getElementById("msg");
  btn.disabled = true; msg.textContent = "";
  try {
    const res = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("password").value }),
    });
    if (res.ok) { location.replace("/"); return; }
    const data = await res.json().catch(() => ({}));
    msg.textContent = data.detail || "Could not log in.";
  } catch {
    msg.textContent = "Cannot reach the laptop. Is it on, and is this phone on the same Wi-Fi?";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
